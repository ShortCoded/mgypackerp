#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[mcp_servers.laravel-boost]
command = "/usr/bin/php"
args = ["artisan", "boost:mcp"]
cwd = "/mnt/Me/MB/Projects/ShortCoded/MgyPack/ERP"
enabled = true
required = true
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.laravel-boost.tools.search-docs]
approval_mode = "approve"

[agents]
max_concurrent_threads_per_session = 1

[agents.explorer]
description = "Explicit credit-first exception only: read-only targeted repository explorer when local tools are insufficient."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Explicit credit-first exception only: bounded implementation worker when free execution is unsuitable."
config_file = "agents/worker.toml"

[agents.deep_worker]
description = "Explicit credit-first exception only: deep implementation worker for justified complex risk."
config_file = "agents/deep_worker.toml"

[agents.reviewer]
description = "Explicit credit-first exception only: read-only semantic reviewer for a named complex risk."
config_file = "agents/reviewer.toml"

[agents.critical_reviewer]
description = "Explicit credit-first exception only: read-only T3 reviewer when deterministic proof is insufficient."
config_file = "agents/critical_reviewer.toml"

[agents.qa]
description = "Explicit credit-first exception only: model QA when deterministic verification is insufficient."
config_file = "agents/qa.toml"
